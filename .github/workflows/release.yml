name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, for example 5.3.0-beta.22. Must match package.json."
        required: true
        type: string
      dry_run:
        description: "Build and upload artifacts only. Do not publish a GitHub release."
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches package.json
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}" -replace "^v",""
            if ($tag -ne $pkg) { throw "Tag $tag does not match package.json $pkg" }
          } else {
            $asked = "${{ inputs.version }}"
            if ($asked -ne $pkg) { throw "Input $asked does not match package.json $pkg" }
          }
          $template = Join-Path "release" "notes-$pkg.md"
          if (-not (Test-Path $template)) { throw "Missing release notes template $template" }
          Write-Host "Building $pkg"

      - name: Download pinned GnuPG for Windows
        run: node scripts/fetch-windows-gpg.mjs

      - name: Build the portable viewer
        shell: pwsh
        run: |
          npx vite build --config vite.portable.config.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build-viewer.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist/portable/viewer.js")) { throw "dist/portable/viewer.js was not produced" }
          if (-not (Test-Path "dist/portable/viewer.css")) { throw "dist/portable/viewer.css was not produced" }

      - name: Verify Google and portable flows
        shell: pwsh
        run: |
          npx tsx scripts/verify-google-return.ts
          npx tsx scripts/verify-google-large.ts
          npx tsx scripts/verify-dropbox.ts
          npx tsx scripts/verify-html-report.ts
          npx tsx scripts/verify-pdf-report.ts
          npx tsx scripts/verify-portable-stream.ts

      - name: Rebuild better-sqlite3 for Electron
        shell: pwsh
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Confirm better-sqlite3 loads in Electron
        shell: pwsh
        env:
          ELECTRON_RUN_AS_NODE: "1"
        run: npx electron -e "const Database=require('better-sqlite3'); const db=new Database(':memory:'); if (db.prepare('select 1 as n').get().n !== 1) process.exit(1); console.log('sqlite-ok');"

      - name: Build NSIS and portable executables
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --win --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the packaged app
        shell: pwsh
        run: node scripts/check-release-asar.mjs dist-electron

      - name: Write release notes
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $templatePath = Join-Path "release" "notes-$pkg.md"
          if (-not (Test-Path $templatePath)) { throw "Missing release notes template $templatePath" }
          $template = Get-Content $templatePath -Raw
          if ($template -notmatch '<!-- PACKAGES -->') { throw "Template $templatePath is missing the <!-- PACKAGES --> marker" }
          $setupName = "Universal.Warrant.Return.Parser.Setup.$pkg.exe"
          $portableName = "Universal.Warrant.Return.Parser.$pkg.exe"
          $setup = Get-ChildItem -Recurse dist-electron -Filter $setupName -File | Select-Object -First 1
          $portable = Get-ChildItem -Recurse dist-electron -Filter $portableName -File | Select-Object -First 1
          if (-not $setup -or -not $portable) {
            Get-ChildItem -Recurse dist-electron -Filter *.exe -File | ForEach-Object { Write-Host $_.FullName }
            throw "Expected $setupName and $portableName under dist-electron"
          }
          function Row($file) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLower()
            "| ``$($file.Name)`` | $($file.Length) | ``$hash`` |"
          }
          $table = @(
            "## Packages",
            "",
            "| File | Size (bytes) | SHA-256 |",
            "| --- | ---: | --- |",
            (Row $setup),
            (Row $portable),
            "",
            "Verify a download in PowerShell. The hash must match this table. Letter case does not matter.",
            "",
            '```powershell',
            "Get-FileHash -Algorithm SHA256 .\Universal.Warrant.Return.Parser.Setup.$pkg.exe",
            "Get-FileHash -Algorithm SHA256 .\Universal.Warrant.Return.Parser.$pkg.exe",
            '```',
            "",
            "Do not run the installer if the hash differs."
          ) -join "`n"
          $body = $template.Replace('<!-- PACKAGES -->', $table)
          Set-Content -Path release-notes.md -Value $body -Encoding utf8
          Write-Host $body

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: |
            dist-electron/Universal.Warrant.Return.Parser*.exe
            dist-electron/**/Universal.Warrant.Return.Parser*.exe
            release-notes.md
          if-no-files-found: error

      - name: Publish GitHub pre-release
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = (Get-ChildItem -Recurse dist-electron -Filter "Universal.Warrant.Return.Parser.Setup.$pkg.exe" -File | Select-Object -First 1).FullName
          $portable = (Get-ChildItem -Recurse dist-electron -Filter "Universal.Warrant.Return.Parser.$pkg.exe" -File | Select-Object -First 1).FullName
          if (-not $setup -or -not $portable) { throw "Expected both executables for $pkg under dist-electron" }
          $ghArgs = @("release","create","v$pkg",$setup,$portable,"--target","${{ github.sha }}","--title","Universal Warrant Return Parser $pkg","--notes-file","release-notes.md")
          if ($pkg -like "*-beta*") { $ghArgs += "--prerelease" }
          gh @ghArgs
